name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The project pins pnpm 10 in packageManager. The e2e battery runs pnpm outside the project,
      # where it needs pnpm 11 or later, so the global corepack default is pinned as well.
      - name: Install pnpm
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack install
          corepack install --global pnpm@12.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on a high or critical advisory in the production dependencies that the lockfile resolves.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: End-to-end tests
        run: pnpm test:e2e
